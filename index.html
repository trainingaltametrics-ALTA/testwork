
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Employee Login Portal</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#0f172a,#1d4ed8);
    }

    .panel {
      background: white;
      padding: 35px;
      width: 100%;
      max-width: 430px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 60px #0003;
    }

    h1 { color: #172033; }

    p { color: #64748b; line-height: 1.6; }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login { background: #2563eb; color: white; }
    .back { background: #e2e8f0; color: #0f172a; }
  </style>
</head>

<body>
  <div class="panel">
    <h1>Employee Login</h1>
    <p>Welcome to the Employee Portal</p>

    <button class="login" onclick="openLogin()">
      Sign In
    </button>

    <button class="back" onclick="goHome()">
      ← Back to Home
    </button>
  </div>

  <script>
    const LOGIN_URL =
      "https://script.google.com/macros/s/AKfycbyf0MA8h7AV1biBy4i8MMwpL0FVq90CtU1GRJpTdzo31UD455wg8GlqfFY-XuULgGRM/exec";

    const HOME_URL =
      "https://sites.google.com/view/demonomm/home";

    function openLogin() {
      window.location.assign(LOGIN_URL);
    }

    function goHome() {
      window.location.replace(HOME_URL);
    }
  </script>
</body>
</html>
